[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-multimodal-ad"
version = "0.1.0"
description = "Domain-owned thesis research pipelines and legacy compatibility interfaces"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["phm2026*", "intel_welding*", "reassemble*", "external_eval*"]
namespaces = false

[tool.pytest.ini_options]
# Dataset-owned tests are explicit; historical run snapshots are not test roots.
testpaths = ["implementations/PHM2026/tests", "implementations/INTEL_WELDING/tests", "implementations/REASSEMBLE/tests", "implementations/MSM/tests", "implementations/HANDOVER/tests", "implementations/REBOOT/tests", "implementations/cross_dataset/tests", "implementations/general/tests"]
addopts = "--import-mode=importlib"
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv",
    "{arch}",
]
