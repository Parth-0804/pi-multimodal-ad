# v3 target definition.
#
# Two changes from v2, both aimed at one problem: in EXP-A/B the photo protocol
# is confounded with tooth index. Teeth 1-4 get ten `camera_sequence` close-ups
# each and nothing else; teeth 5-28 get one `canonical_tooth` wide shot. EXP-F
# gets one wide shot for every tooth. v2 took a maximum across views, and a
# maximum over ten draws exceeds a maximum over one at equal damage: measured
# inflation +1.415 pp (EXP-A) and +0.899 pp (EXP-B), against a constant
# baseline whose entire MAE is 0.6797 pp.
#
#   1. excluded_tooth_ids [1,2,3,4] - dropped in ALL three experiments. No
#      tooth is measured under both roles, so no calibration between them can
#      be fitted; removing them deletes the confound at source rather than
#      mitigating it. EXP-F is unaffected: teeth 1-4 take 0 of its 24 top-3
#      slots, so its target is bit-identical.
#   2. camera_view_aggregation single_deterministic_view - one view per tooth
#      everywhere, so view count cannot leak into the label at all.
#
# v2 remains intact and reproducible via phm2026_image_target.yaml.
# Cost: 24 teeth, not 28. This deviates from the challenge's "all 28 teeth"
# framing and must be stated in the methods section, not buried.

