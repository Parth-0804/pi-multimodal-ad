    enabled: false
    target_name: null
    physical_meaning: null
    unit: null
    timestamp_source: null
    six_hour_interpretation: null
    computation_version: null
execution:
  seed: 20260813
  seed_report:
    python_seeded: true
    numpy_seeded: true
    torch_seeded: true
    torch_deterministic_algorithms: true
  limit: 2
  dry_run: false
  data_root: gtc-data-experiment
