dataset_config:
  schema_version: 1.0.0
  dataset:
    name: phm2026
    data_root: gtc-data-experiment
    excluded_repository_roots:
    - data/Full Dataset
  include:
    experiments:
      EXP-A:
        runs:
        - 1
        - 2
        - 3
        - 4
        - 5
      EXP-B:
        runs:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
      EXP-F:
        runs:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
    modality_roots:
      high_frequency:
      - high_frequency/EXP A
      - high_frequency/EXP B
      - high_frequency/EXP F
      low_frequency:
      - low-frequency (CIs + Oil + Environment)
      condition_indicator:
      - low-frequency (CIs)
      image:
      - photos/EXP-A
      - photos/EXP-B
      - photos/EXP-F
    file_extensions:
    - .zip
    expectation_mode_by_modality:
      high_frequency: runs
      low_frequency: experiments
      condition_indicator: experiments
      image: runs
  exclude:
    experiments: []
    runs: []
    path_globs:
    - '**/*.part'
  phm_rules:
    hdf5_path_aliases:
      vibration:
      - /Vibration
      operating_context:
      - /Context
      condition_indicator:
      - /CI
      - /CI_4s
    photo_stage_aliases:
