# Re-score existing predictions under the organizer's actual metric.
#
# The challenge scores MSE after an optimal monotonic rescale of predictions,
# so only trajectory shape counts. Every number in this repository so far is
# raw MAE on a self-defined scale. Nothing here trains anything: it reads a
# pinned prediction table and re-scores it, so it cannot touch EXP-F selection.
schema_version: "1.0.0"
study: phm2026_monotonic_rescoring
dataset_config: configs/datasets/phm2026.yaml
seed: 20260912
output_root: runs/phm2026_monotonic_rescoring
source_runs:
  patchtst:
    run_id: 20260911T193200607744Z-433d4154
    directory: runs/phm2026_patchtst_baseline/20260911T193200607744Z-433d4154
    artifacts:
      tables/predictions.parquet: ae48d13b22c73b54bf3618f6de57481a486dc7c54bc141240fde161a8fde97ce
scoring:
  target_variants: [raw_top3_mean_pct, causal_monotonic_top3_mean_pct]
  splits: [train, validation, test]
